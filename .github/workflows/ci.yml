name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: lint
        # `next lint` was removed in Next 16; the scaffold's script runs
        # eslint directly with the flat config in eslint.config.mjs.
        run: npm run lint

      - name: types and build
        # Placeholder Supabase values: the build only needs these to
        # exist, and nothing at build time talks to a real project.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-time-placeholder
        run: npm run build

      - name: tests
        run: npm test

  database:
    name: postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: start supabase
        run: supabase start

      - name: migrations and pgTAP
        # Fails if a migration is broken or an invariant regressed: RLS
        # coverage, the idempotency indexes, the credit functions being
        # revoked from authenticated.
        run: supabase test db

  worker:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: dependencies
        # requirements-dev only: torch, demucs, faster-whisper and
        # transformers are multi-gigabyte and never exercised by these
        # tests, which is the point of the lazy-import boundary.
        run: pip install -r worker/requirements-dev.txt

      - name: generate fixtures
        # Audio fixtures are generated rather than committed, so the
        # ground truth lives in code and the repo stays small.
        run: python worker/tests/make_fixtures.py

      - name: lint
        run: python -m ruff check worker/

      - name: tests
        run: python -m pytest worker/tests -q
